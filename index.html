<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o numero</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>    
</head>

<body>
    <main>
        <h1>Jodo de Adivinhação</h1>
        <p>Pense em um número entre 1 e 100 e tente adivinhar!</p>
        <form>
            <label for="guess">Seu palpite:</label>
            <input type="number" id="guess" placeholder="Digite seu palpite" required>
            <button type="button" id="meuBotao" onclick="chutar()">Chutar</button>
        </form>
        <p id="mensagem"></p>
        <p id="tentativas">Numero de tentativas restantes: 10</p>
    </main>    
</body>
</html>
